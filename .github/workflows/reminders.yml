# Sends Twodo push reminders. Runs every 5 minutes for free on public repos.
# It can see WHEN a reminder is due, but the title is encrypted and only your phones can read it.
name: Send reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions pinned to exact commits, and dependencies to exact versions + checksums (package-lock.json),
      # so nothing new can sneak into a job that holds your Firebase and push keys
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/reminders
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install
        working-directory: .github/reminders
        run: npm ci --ignore-scripts --no-audit --no-fund --silent
      - name: Send due reminders
        working-directory: .github/reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node send.mjs
