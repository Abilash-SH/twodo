# Builds the iPhone app on Expo's Macs and sends it to TestFlight whenever the app changes on main.
# No over-the-air updates: every change ships as a full, Apple-signed build (docs/architecture.md, section 1).
name: Build and send to TestFlight

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'

jobs:
  build_ios:
    name: Build the iPhone app
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Send it to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      changelog: 'A new build from main'
